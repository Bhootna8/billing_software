[package]
name = "billing-software"
version = "0.1.0"
description = "High-speed Retail and Wholesale Desktop Operating System"
authors = ["Enterprise Dev Team"]
edition = "2021"

[lib]
name = "billing_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.40", features = ["serde"] }
parking_lot = "0.12.3"
